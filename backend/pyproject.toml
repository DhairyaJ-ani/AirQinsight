[project]
name = "backend"
version = "0.1.0"
description = "AI/ML Satellite-Based Air Quality Downscaling & Analysis System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "supabase>=2.31.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.15.0",
    "httpx>=0.27.0",
    "reportlab>=4.0.0",
    # ML engine
    "earthengine-api>=1.7.45",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "rasterio>=1.5.1",
    "rioxarray>=0.23.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "xarray>=2026.7.0",
    "xgboost>=3.4.1",
    "torch>=2.2.0",
    "tensorboard>=2.16.0",
    "uharfbuzz>=0.56.2",
    "yamspy",
    "opencv-python-headless>=5.0.0.93",
    "pyserial>=3.5",
    "langgraph>=1.2.12",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "python-docx>=1.2.0",
    "shap>=0.52.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::PendingDeprecationWarning:rioxarray"]
